name: nethserver/webtop-logs
description: "Parse WebTop authentication events"
# Apache only sees the Traefik address and answers 200 on failure: this line carries the real client
filter: "evt.Parsed.program == 'webapp' && evt.Parsed.message startsWith 'webtop-auth:'"
onsuccess: next_stage
nodes:
  - grok:
      pattern: 'webtop-auth: \[%{DATA}\]\[%{DATA}\] %{NOTSPACE:session}: client=%{IP:client_ip} profile=%{NOTSPACE:profile} action=%{WORD:action}'
      apply_on: message
      statics:
        - meta: log_type
          value: webtop_auth
        - meta: source_ip
          expression: evt.Parsed.client_ip
        - meta: username
          expression: evt.Parsed.profile
        - meta: auth_action
          expression: evt.Parsed.action
statics:
  - meta: service
    value: webtop
