type: leaky
name: nethserver/nethvoice-middleware-bf
description: "Detect login brute force against nethcti-middleware API"
# A wrong password answers 401; a wrong OTP answers 400 on /2fa/verify-otp
# (429 once the user is locked).
filter: "evt.Meta.log_type == 'nethvoice_middleware_access-log' && evt.Meta.http_verb == 'POST' && ((evt.Meta.http_status == '401' && evt.Meta.http_path in ['/login', '/2fa/disable', '/authentication/phone_island_token_login']) || (evt.Meta.http_status in ['400', '429'] && evt.Meta.http_path == '/2fa/verify-otp'))"
groupby: evt.Meta.source_ip
capacity: 8
leakspeed: "10m"
blackhole: "15m"
labels:
  confidence: 2
  spoofable: 0
  classification:
    - attack.T1110
  behavior: "http:bruteforce"
  label: "NethVoice middleware brute force"
  service: nethvoice-middleware
  remediation: true
