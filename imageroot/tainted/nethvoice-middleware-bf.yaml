type: leaky
name: nethserver/nethvoice-middleware-bf
description: "Detect login brute force against nethcti-middleware API"
filter: "evt.Meta.log_type == 'nethvoice_middleware_access-log' && evt.Meta.http_status == '401' && evt.Meta.http_verb == 'POST' && evt.Meta.http_path in ['/login', '/2fa/verify', '/2fa/recovery', '/authentication/phone_island_token_login']"
groupby: evt.Meta.source_ip
capacity: 8
leakspeed: "10m"
blackhole: "15m"
labels:
  confidence: 2
  spoofable: 0
  classification:
    - attack.T1110
  behavior: "http:bruteforce"
  label: "NethVoice middleware brute force"
  service: nethvoice-middleware
  remediation: true
