type: http
name: nethesis_insights
log_level: error

# Send bans in batches, below the server's 500-decision limit.
group_wait: 30s
group_threshold: 100
timeout: 10s

url: {{ insights_url }}/blocklist/v1/events
method: POST

headers:
  Content-Type: application/json
  # base64(system_id:auth_token)
  Authorization: Basic {{ insights_basic_auth }}

# Send only the fields the server expects; other alert data stays on this
# node.
{% raw %}
format: |
  {{- $first := true -}}
  {"schema_version":1,"decisions":[
  {{- range . -}}
    {{- /* Alert.Simulated is a *bool: `if .Simulated` would be true whenever
           the pointer is set, whatever the value. Compare the JSON instead. */ -}}
    {{- if eq (.Simulated | toJson) "false" -}}
      {{- $ts := .StopAt -}}
      {{- if not $ts }}{{ $ts = .CreatedAt }}{{ end -}}
      {{- range .Decisions -}}
        {{- if $first }}{{ $first = false }}{{ else }},{{ end -}}
        {"value":{{ .Value | toJson }},"scope":{{ .Scope | toJson }},
         "type":{{ .Type | toJson }},"scenario":{{ .Scenario | toJson }},
         "origin":{{ .Origin | toJson }},"duration":{{ .Duration | toJson }},
         "created_at":{{ $ts | toJson }}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  ]}
{% endraw %}
